name: Release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish (must match Cargo.toml)
        required: true
        default: v0.9.0
permissions:
  contents: read
concurrency:
  group: zistral-release
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      needed: ${{ steps.check.outputs.needed }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REQUESTED_TAG: ${{ github.event.inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: version
        shell: python
        run: |
          import os, re, tomllib
          tag = 'v' + tomllib.load(open('Cargo.toml', 'rb'))['package']['version']
          assert re.fullmatch(r'v\d+\.\d+\.\d+', tag)
          requested = os.environ.get('REQUESTED_TAG')
          if requested: assert requested == tag
          if os.environ['GITHUB_REF_TYPE'] == 'tag': assert os.environ['GITHUB_REF_NAME'] == tag
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f: f.write('tag=' + tag + '\n')
      - name: Validate current version release notes
        run: |
          python scripts/test_release_notes.py
          python scripts/release_notes.py "${{ steps.version.outputs.tag }}" > /dev/null
      - name: Skip versions already released
        id: check
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh api "repos/$GH_REPO/releases" --paginate --jq '.[].tag_name' > released.txt
          if grep -Fxq "$RELEASE_TAG" released.txt; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
            if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null; then
              test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" = "$GITHUB_SHA"
            fi
          fi
  build:
    needs: prepare
    if: needs.prepare.outputs.needed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate version
        shell: python
        run: |
          import os, re, tomllib
          version = tomllib.load(open('Cargo.toml', 'rb'))['package']['version']
          assert re.fullmatch(r'v\d+\.\d+\.\d+', os.environ['RELEASE_TAG'])
          assert os.environ['RELEASE_TAG'] == 'v' + version
      - name: Rust stable
        run: rustup update stable --no-self-update && rustup default stable
      - run: rustup target add ${{ matrix.target }}
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package native installer and portable archive
        run: python scripts/package.py --target ${{ matrix.target }}
      - name: Test Windows installation, upgrade and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-install.ps1
      - name: Test Linux installation and uninstall
        if: runner.os == 'Linux'
        run: |
          sudo dpkg -i dist/*.deb
          test "$(zi --version)" = "zi ${RELEASE_TAG#v}"
          echo hello | zi --count | python -c 'import json,sys; assert json.load(sys.stdin)["words"] == 1'
          sudo dpkg -r zistral
      - name: Test macOS installation
        if: runner.os == 'macOS'
        run: |
          sudo installer -pkg dist/*.pkg -target /
          test "$(/usr/local/bin/zi --version)" = "zi ${RELEASE_TAG#v}"
          echo hello | /usr/local/bin/zi --count | python -c 'import json,sys; assert json.load(sys.stdin)["words"] == 1'
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*-setup.exe
            dist/*.deb
            dist/*.pkg
          if-no-files-found: error
  msrv:
    needs: prepare
    if: needs.prepare.outputs.needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.85.0 --profile minimal
      - run: cargo +1.85.0 check --locked
  publish:
    needs: [prepare, build, msrv]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: sha256sum *.zip *.tar.gz *.exe *.deb *.pkg > SHA256SUMS.txt
      - name: Generate current version release notes
        run: python scripts/release_notes.py "$RELEASE_TAG" > release-notes.md
      - name: Publish complete release
        run: |
          gh release create "$RELEASE_TAG" artifacts/* --target "$GITHUB_SHA" --title "Zistral $RELEASE_TAG" --notes-file release-notes.md --latest
