[package]
name = "zistral"
version = "0.12.0"
edition = "2024"
rust-version = "1.85"
description = "A small, pipe-native command-line agent. Type zi, get results."
license = "MIT"
repository = "https://github.com/ax2/zistral"
keywords = ["agent", "cli", "llm", "pipe", "ai"]
categories = ["command-line-utilities"]

[[bin]]
name = "zi"
path = "src/main.rs"

[dependencies]
anyhow = "1"
ignore = "=0.4.25"
ctrlc = "3.4"
console = "0.15"
indicatif = "0.17"
httpdate = "1.0.3"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rpassword = "7.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
toml = "0.9"
tempfile = "3"
unicode-segmentation = "1"

[dev-dependencies]
portable-pty = "0.9"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
