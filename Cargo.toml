[package]
name = "zistral"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A small, pipe-native command-line agent. Type zi, get results."
license = "MIT"
repository = "https://github.com/ax2/zistral"
keywords = ["agent", "cli", "llm", "pipe", "ai"]
categories = ["command-line-utilities"]

[[bin]]
name = "zi"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
unicode-segmentation = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
